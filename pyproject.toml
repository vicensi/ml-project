[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsplatform"
version = "0.1.0"
description = "End-to-end ML/MLOps platform for hourly time-series forecasting (synthetic data)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs real services (Postgres, Redis, MLflow...) — skipped when unavailable",
    "e2e: full pipeline test over the real Docker Compose stack",
]
