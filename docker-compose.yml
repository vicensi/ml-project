# Phases 1-2 stack: PostgreSQL + Redis + one-shot jobs (ingest, features, tests). MLflow, Airflow,
# API and Streamlit are added in later phases (see docs/ARCHITECTURE.md). Requires a .env file (cp .env.example .env).
name: tsplatform

x-app-env: &app-env
  TSP_ENVIRONMENT: ${TSP_ENVIRONMENT:-local}
  TSP_LOG_LEVEL: ${TSP_LOG_LEVEL:-INFO}
  TSP_DB_HOST: postgres
  TSP_DB_PORT: "5432"
  TSP_DB_NAME: ${APP_DB_NAME}
  TSP_DB_USER: ${APP_DB_USER}
  TSP_DB_PASSWORD: ${APP_DB_PASSWORD}
  TSP_GEN_SEED: ${TSP_GEN_SEED:-42}
  TSP_GEN_N_SERIES: ${TSP_GEN_N_SERIES:-5}
  TSP_GEN_N_HOURS: ${TSP_GEN_N_HOURS:-4368}
  TSP_GEN_START: ${TSP_GEN_START:-2025-01-01T00:00:00}
  TSP_GEN_ANOMALY_RATE: ${TSP_GEN_ANOMALY_RATE:-0.002}

# Read by feast_repo/feature_store.yaml through ${VAR} expansion (no credentials in the repo).
x-feast-env: &feast-env
  APP_DB_HOST: postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: ${APP_DB_NAME}
  APP_DB_USER: ${APP_DB_USER}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD}
  APP_DB_SSLMODE: ${APP_DB_SSLMODE:-disable}   # the local postgres container has no TLS
  FEAST_DB_HOST: postgres
  FEAST_DB_PORT: "5432"
  FEAST_DB_NAME: ${FEAST_DB_NAME}
  FEAST_DB_USER: ${FEAST_DB_USER}
  FEAST_DB_PASSWORD: ${FEAST_DB_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: "6379"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MLFLOW_DB_NAME: ${MLFLOW_DB_NAME}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD}
      AIRFLOW_DB_NAME: ${AIRFLOW_DB_NAME}
      AIRFLOW_DB_USER: ${AIRFLOW_DB_USER}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      FEAST_DB_NAME: ${FEAST_DB_NAME}
      FEAST_DB_USER: ${FEAST_DB_USER}
      FEAST_DB_PASSWORD: ${FEAST_DB_PASSWORD}
      TEST_DB_NAME: ${TEST_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: generate synthetic data and persist it (idempotent). Run with:
  #   docker compose --profile jobs run --rm ingest
  ingest:
    profiles: ["jobs"]
    build: { context: ., target: base }
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    command: ["python", "-m", "tsplatform.cli", "ingest"]

  # Feature pipeline steps (one-shot). Order: ingest -> build-features -> feast-apply -> feast-materialize
  #   docker compose --profile jobs run --rm features python -m tsplatform.cli build-features
  #   docker compose --profile jobs run --rm features python -m tsplatform.cli feast-apply
  #   docker compose --profile jobs run --rm features python -m tsplatform.cli feast-materialize
  #   docker compose --profile jobs run --rm features python -m tsplatform.cli verify-features
  features:
    profiles: ["jobs"]
    build: { context: ., target: features }
    environment:
      <<: [*app-env, *feast-env]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["python", "-m", "tsplatform.cli", "--help"]

  # Unit + integration tests against the real Postgres test database. Run with:
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build: { context: ., target: dev }
    environment:
      <<: [*app-env, *feast-env]
      TSP_TEST_DATABASE_URL: postgresql+psycopg2://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${TEST_DB_NAME}
      TSP_TEST_REDIS: redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["pytest", "-q"]

volumes:
  pgdata:
  redisdata:
